name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo fmt
        run: cargo fmt --all --check
      - name: cargo clippy (core)
        run: cargo clippy --all-targets -- -D warnings
      - name: cargo clippy (python bindings)
        run: cargo clippy --all-targets --features python -- -D warnings
      - name: cargo test
        run: cargo test

  python:
    name: Python ${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Create venv & install dev dependencies
        run: |
          uv venv
          uv pip install --group dev
      - name: Build extension (release)
        run: uv run --no-sync maturin develop --release
      - name: ruff
        run: uv run --no-sync ruff check python tests benches
      - name: mypy --strict
        run: uv run --no-sync mypy --strict python/nextfake tests/test_typing.py
      - name: pytest
        run: uv run --no-sync pytest -v

  free-threaded:
    name: Free-threaded CPython 3.14t smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.14t"
      - run: |
          uv venv
          uv pip install maturin pytest
          uv run --no-sync maturin develop --release
          uv run --no-sync python -c "import sys, nextfake; assert not sys._is_gil_enabled(); print(nextfake.Faker(seed=1).names(5))"
